<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="finova-app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#080E1E" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Squircle Border -->
    <linearGradient id="finova-app-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Ambient Backlight -->
    <radialGradient id="finova-app-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="65%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- F Ribbon Gradient -->
    <linearGradient id="finova-f-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Mid F Crossbar -->
    <linearGradient id="finova-mid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- V Rising Wing -->
    <linearGradient id="finova-v-grad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="30%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <filter id="finova-app-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#finova-app-bg)" stroke="url(#finova-app-border)" stroke-width="1.5" />
  <circle cx="64" cy="64" r="48" fill="url(#finova-app-radial)" />

  <!-- Centered Symbol -->
  <g transform="translate(24, 25) scale(0.72)" filter="url(#finova-app-glow)">
    <!-- F Top Arch & Primary Spine -->
    <path
      d="M16 42C16 23.5 29 14 46 14H76C78.5 14 80 16.5 78.8 18.8L72.5 30.5C71.5 32.5 69.4 33.6 67.2 33.6H42C35 33.6 30 38.5 30 45.5V74C30 77.5 26.5 79.5 23.2 78L18.8 75.8C17 74.9 16 73 16 71V42Z"
      fill="url(#finova-f-grad)"
    />

    <!-- F Middle Horizontal Arm -->
    <path
      d="M30 46H66C68.5 46 70 48.5 68.8 50.8L64.2 59.2C63.2 61 61.2 62 59.2 62H30V46Z"
      fill="url(#finova-mid-grad)"
    />

    <!-- The V Rising Wing -->
    <path
      d="M30 62C30 73 39.5 83 50.5 83C57.5 83 64 78 68.5 69.5L91 22C92.2 19.5 95.5 19.5 96.5 22L100 29.5C101 31.8 100.5 34.2 99 36.2L74 84C66.5 97.5 50.5 98.5 39 88.5C33.5 83.5 30 75 30 62Z"
      fill="url(#finova-v-grad)"
    />
  </g>
</svg>
